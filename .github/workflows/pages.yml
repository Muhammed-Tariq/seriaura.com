name: Publish site and refresh Substack
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run sync:blog
      # Retain older posts when Substack's rolling feed eventually drops them.
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add writings index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public Substack writings'
            git push
          fi
      # Only public site files enter the deployment artifact.
      - run: |
          mkdir _site
          cp *.html *.css *.js _site/
          cp -r assets brand-guidelines counting credits payment vibing writings _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
